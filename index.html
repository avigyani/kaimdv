<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIMDV — ಉಚಿತ AI ಚಿತ್ರ ಮತ್ತು ಬರಹ</title>
<meta name="description" content="ಉಚಿತ AI ಸ್ಟುಡಿಯೋ: ಒಂದು ಸಾಲು ಬರೆಯಿರಿ, ಚಿತ್ರ ಪಡೆಯಿರಿ. ಉಚಿತ AI ಬರಹಗಾರ. — ಅವಿಜ್ಞಾನಿ">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FFF;color:#0D0D0D;font-family:ui-sans-system,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  /* top bar */
  .topbar{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:20}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:1.15rem;cursor:pointer;color:#0D0D0D}
  .iconbtn:hover{background:#F4F4F4}
  .model{font-weight:600;font-size:1.05rem;padding:7px 12px;border-radius:10px;cursor:pointer}
  .model:hover{background:#F4F4F4}
  .model span{color:#8E8E93;font-weight:400;font-size:.8rem;margin-left:2px}
  .avatar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FF8A00,#DD2476);color:#FFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
  /* main column */
  .col{flex:1;width:100%;max-width:760px;margin:0 auto;padding:8px 16px 10px;display:flex;flex-direction:column}
  /* greeting / empty state */
  .greet{margin:auto;text-align:center;padding:34px 6px}
  .greet h1{font-size:1.75rem;font-weight:600;letter-spacing:-.01em}
  .greet p{color:#6B6B70;margin-top:8px;font-size:.98rem}
  /* conversation */
  #flow{display:flex;flex-direction:column;gap:22px;padding:14px 0 6px}
  .turn-u{align-self:flex-end;background:#F4F4F4;border-radius:22px;padding:10px 16px;max-width:88%;line-height:1.55;white-space:pre-wrap}
  .turn-a{align-self:stretch;line-height:1.7;white-space:pre-wrap}
  .turn-a img{max-width:100%;border-radius:16px;border:1px solid #E7E7E7}
  .acts{margin-top:8px;display:flex;gap:8px}
  .actbtn{border:1px solid #E0E0E0;background:#FFF;border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600;color:#0D0D0D;text-decoration:none;cursor:pointer}
  .actbtn:hover{background:#F4F4F4}
  .thinking{color:#6B6B70;display:flex;align-items:center;gap:9px}
  .dotpulse{width:9px;height:9px;border-radius:50%;background:#0D0D0D;animation:pl 1s ease-in-out infinite}
  @keyframes pl{0%,100%{transform:scale(.65);opacity:.5}50%{transform:scale(1);opacity:1}}
  /* mode + option chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid #E0E0E0;background:#FFF;color:#0D0D0D;border-radius:999px;padding:8px 15px;font-size:.92rem;font-weight:500;cursor:pointer}
  .chip:hover{background:#F4F4F4}
  .chip.active{background:#0D0D0D;color:#FFF;border-color:#0D0D0D}
  .optrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .optrow select{border:1px solid #E0E0E0;background:#FFF;border-radius:999px;padding:8px 12px;font:inherit;font-size:.9rem;font-weight:500;color:#0D0D0D}
  /* composer */
  .composer{position:sticky;bottom:0;background:#FFF;padding:10px 0 6px}
  .box{display:flex;align-items:flex-end;gap:8px;border:1px solid #E0E0E0;border-radius:26px;padding:8px 8px 8px 18px;box-shadow:0 4px 18px rgba(0,0,0,.06);background:#FFF}
  .box textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:1rem;line-height:1.45;max-height:140px;padding:8px 0;background:transparent;color:#0D0D0D}
  .box textarea::placeholder{color:#9A9AA0}
  .send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:#0D0D0D;color:#FFF;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:#D8D8DC;cursor:default}
  .plusbtn{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:#0D0D0D;font-size:1.45rem;line-height:1;cursor:pointer}
  .plusbtn:hover{background:#F4F4F4}
  .micbtn{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:1.05rem;cursor:pointer}
  .micbtn:hover{background:#F4F4F4}
  .micbtn.off{opacity:.38}
  .micbtn.live{background:#FCE4EC}
  .under{font-size:.76rem;color:#9A9AA0;text-align:center;margin-top:9px}
  a.avatar{text-decoration:none}
  .menupanel{position:absolute;top:54px;left:10px;z-index:30;background:#FFF;border:1px solid #E7E7E7;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.14);padding:12px;width:250px}
  .mp-title{font-size:.78rem;font-weight:700;color:#8E8E93;letter-spacing:.06em;margin:2px 4px 8px}
  .mp-link{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;color:#0D0D0D;text-decoration:none;font-weight:600;font-size:.95rem}
  .mp-link:hover{background:#F4F4F4}
  .mp-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FFF;font-weight:700;flex:none}
  .mp-ic.fb{background:#1877F2}
  .mp-ic.ig{background:linear-gradient(45deg,#F09433,#E6683C,#DC2743,#CC2366,#BC1888)}
  .filechip{cursor:pointer;display:inline-block}
  .fname{font-size:.85rem;color:#6B6B70}
  .eprev{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid #E7E7E7}
  footer{text-align:center;color:#9A9AA0;font-size:.8rem;padding:4px 0 14px}
  .followcard{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(45deg,#F09433,#E6683C,#DC2743,#CC2366,#BC1888);color:#FFF;font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(220,39,103,.35);margin-bottom:9px}
  .followcard svg{display:block}
  .foot-line{color:#9A9AA0}
  .hidden{display:none}
</style>
</head>
<body>

<div class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
  <div class="model">KAIMDV <span>▾</span></div>
  <a class="avatar" href="https://facebook.com/avigyaani" aria-label="Facebook">ಅ</a>
</div>
<div class="menupanel hidden" id="menuPanel">
  <div class="mp-title">ಹಿಂಬಾಲಿಸಿ</div>
  <a class="mp-link" href="https://facebook.com/avigyaani"><span class="mp-ic fb">f</span> Facebook · ಅವಿಜ್ಞಾನಿ</a>
  <a class="mp-link" href="https://www.instagram.com/avigyani"><span class="mp-ic ig">◎</span> Instagram · @avigyani</a>
</div>

<div class="col">
  <div class="greet" id="greet">
    <h1>ನಿಮಗಾಗಿ ಏನು ಮಾಡಲಿ?</h1>
    <p>ಚಿತ್ರ ಮಾಡುತ್ತೇನೆ, ಬರಹ ಬರೆಯುತ್ತೇನೆ — ಕೇಳಿ ನೋಡಿ</p>
  </div>

  <div id="flow"></div>

  <div class="composer">
    <div class="chips" id="modeChips" style="margin-bottom:10px">
      <button class="chip active" data-mode="img">🖼 ಚಿತ್ರ ಮಾಡಿ</button>
      <button class="chip" data-mode="txt">✍️ ಬರಹ ಬರೆಯಿರಿ</button>
      <button class="chip" data-mode="edit">🪄 ಫೋಟೋ ಎಡಿಟ್</button>
    </div>
    <div class="optrow" id="imgOpts">
      <div class="chips" id="styleChips">
        <button class="chip active" data-style="photo">📷 ನಿಜ ಛಾಯಾಚಿತ್ರ</button>
        <button class="chip" data-style="paint">🎨 ಚಿತ್ರಕಲೆ</button>
        <button class="chip" data-style="anime">🌸 ಅನಿಮೆ</button>
        <button class="chip" data-style="render">🧊 3D ರೆಂಡರ್</button>
      </div>
      <select id="imgSize" aria-label="ಗಾತ್ರ">
        <option value="1024x1024">ಚೌಕ</option>
        <option value="768x1152">ಉದ್ದ</option>
        <option value="1152x768">ಅಗಲ</option>
      </select>
    </div>
    <div class="optrow hidden" id="editOpts">
      <label class="chip filechip" for="editFile">📷 ಫೋಟೋ ಆಯ್ಕೆ ಮಾಡಿ</label>
      <input type="file" id="editFile" accept="image/*" class="hidden">
      <span class="fname" id="editName"></span>
      <img class="eprev hidden" id="editPrev" alt="">
    </div>
    <div class="box">
      <button class="plusbtn" id="plusBtn" aria-label="ಫೋಟೋ / ವೀಡಿಯೊ ಸೇರಿಸಿ">+</button>
      <input type="file" id="plusFile" accept="image/*,video/*" class="hidden">
      <textarea id="prompt" rows="1" placeholder="ಏನು ಚಿತ್ರ ಬೇಕು? ವಿವರಿಸಿ…"></textarea>
      <button class="micbtn" id="micBtn" aria-label="ಧ್ವನಿ ಟೈಪಿಂಗ್">🎤</button>
      <button class="send" id="sendBtn" aria-label="ಕಳುಹಿಸಿ">↑</button>
    </div>
    <p class="under" id="quotaLine"></p>
  </div>

  <footer>
    <a class="followcard" href="https://www.instagram.com/avigyani"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#FFF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="#FFF" stroke="none"/></svg>ಫಾಲೋ ಮಾಡಿ</a>
    <div class="foot-line">ಪ್ರೀತಿಯಿಂದ — ಅವಿಜ್ಞಾನಿ</div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const flow = $('flow'), promptEl = $('prompt');

/* ---------- Gemini text engine (Pollinations is the last-resort fallback) ---------- */
const GEMINI_KEY = 'AQ.Ab8RN6IjENchQWKq4gKNoMDJqJ6NWGrGaEfUxkqeua7H1iCUrw';
const GEMINI_MODELS = ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-3.8-flash'];
async function geminiText(promptText){
  for (const m of GEMINI_MODELS) {
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GEMINI_KEY },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });
      if (!r.ok) continue;
      const d = await r.json();
      const parts = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
      const out = parts ? parts.map(p => p.text || '').join('').trim() : '';
      if (out) return out;
    } catch (e) { /* try the next model */ }
  }
  const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(promptText));
  if (!r2.ok) throw new Error('busy');
  return (await r2.text()).trim();
}

/* ---------- Gemini photo edit ---------- */
const EDIT_MODELS = ['gemini-3.1-flash-image', 'gemini-2.5-flash-image'];
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1024, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function geminiEditImage(promptText, base64){
  for (const m of EDIT_MODELS) {
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GEMINI_KEY },
        body: JSON.stringify({
          contents: [{ parts: [
            { text: promptText },
            { inline_data: { mime_type: 'image/jpeg', data: base64 } }
          ] }],
          generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
        })
      });
      if (!r.ok) continue;
      const d = await r.json();
      const parts = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
      if (!parts) continue;
      for (const p of parts) {
        const id = p.inlineData || p.inline_data;
        if (id && id.data) return 'data:' + (id.mimeType || id.mime_type || 'image/png') + ';base64,' + id.data;
      }
    } catch (e) { /* try the next model */ }
  }
  throw new Error('busy');
}

/* ---------- daily soft quota (this browser only) ---------- */
const LIMITS = { img: 20, txt: 30 };
function quotaLeft(kind){
  const key = 'aistudio_' + kind + '_' + new Date().toISOString().slice(0, 10);
  const used = parseInt(localStorage.getItem(key) || '0', 10);
  return { key, left: Math.max(0, LIMITS[kind] - used), used };
}
function useQuota(kind){
  const q = quotaLeft(kind);
  localStorage.setItem(q.key, String(q.used + 1));
}
function paintQuota(){
  $('quotaLine').textContent =
    'ಇಂದು ಉಳಿದ ಉಚಿತ ಚಿತ್ರಗಳು: ' + quotaLeft('img').left + '/' + LIMITS.img +
    ' · ಉಚಿತ ಬರಹಗಳು: ' + quotaLeft('txt').left + '/' + LIMITS.txt;
}
paintQuota();

/* ---------- top menu (social links card) ---------- */
$('menuBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('menuPanel').classList.toggle('hidden');
});
document.addEventListener('click', e => {
  if (!$('menuPanel').classList.contains('hidden') &&
      !$('menuPanel').contains(e.target)) $('menuPanel').classList.add('hidden');
});

/* ---------- mode + style ---------- */
let mode = 'img', curStyle = 'photo';
$('modeChips').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll('#modeChips .chip').forEach(c => c.classList.toggle('active', c === b));
  $('imgOpts').classList.toggle('hidden', mode !== 'img');
  $('editOpts').classList.toggle('hidden', mode !== 'edit');
  promptEl.placeholder = mode === 'img' ? 'ಏನು ಚಿತ್ರ ಬೇಕು? ವಿವರಿಸಿ…' :
    mode === 'edit' ? 'ಈ ಫೋಟೋದಲ್ಲಿ ಏನು ಬದಲಾಯಿಸಬೇಕು? ಬರೆಯಿರಿ…' : 'ಏನು ಬರೆಯಿಸಬೇಕು? ಇಲ್ಲಿ ಬರೆಯಿರಿ…';
  promptEl.focus();
});
/* ---------- + attach (photo / video) ---------- */
$('plusBtn').addEventListener('click', () => $('plusFile').click());
$('plusFile').addEventListener('change', () => {
  const f = $('plusFile').files[0];
  if (!f) return;
  if (f.type.startsWith('image/')) {
    const dt = new DataTransfer();
    dt.items.add(f);
    $('editFile').files = dt.files;
    $('editFile').dispatchEvent(new Event('change'));
    document.querySelector('#modeChips [data-mode="edit"]').click();
  } else {
    $('greet').classList.add('hidden');
    const d = document.createElement('div');
    d.className = 'turn-a';
    d.textContent = 'ವೀಡಿಯೊ ಸದ್ಯಕ್ಕೆ ಆಗುವುದಿಲ್ಲ 🙏 — ಫೋಟೋ ಹಾಕಿದರೆ ಎಡಿಟ್ ಮಾಡಬಹುದು.';
    flow.appendChild(d);
    window.scrollTo({top: document.body.scrollHeight});
  }
  $('plusFile').value = '';
});

/* ---------- voice command: mic typing, auto-send ---------- */
$('micBtn').addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $('greet').classList.add('hidden');
    const d = document.createElement('div');
    d.className = 'turn-a';
    d.textContent = 'ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಧ್ವನಿ ಟೈಪಿಂಗ್ ಸಿಗುತ್ತಿಲ್ಲ — Chrome ನಲ್ಲಿ ಪ್ರಯತ್ನಿಸಿ.';
    flow.appendChild(d);
    return;
  }
  const rec = new SR();
  rec.lang = 'kn-IN';
  rec.interimResults = false;
  $('micBtn').classList.add('live');
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    promptEl.value = (promptEl.value + ' ' + t).trim();
    promptEl.dispatchEvent(new Event('input'));
    setTimeout(send, 350);
  };
  rec.onend = () => $('micBtn').classList.remove('live');
  rec.onerror = () => $('micBtn').classList.remove('live');
  try { rec.start(); } catch (e) { $('micBtn').classList.remove('live'); }
});

$('editFile').addEventListener('change', () => {
  const f = $('editFile').files[0];
  if (!f) return;
  $('editName').textContent = f.name.length > 22 ? f.name.slice(0, 22) + '…' : f.name;
  const p = $('editPrev');
  p.src = URL.createObjectURL(f);
  p.classList.remove('hidden');
});
$('styleChips').addEventListener('click', e => {
  const b = e.target.closest('[data-style]'); if (!b) return;
  document.querySelectorAll('#styleChips .chip').forEach(c => c.classList.toggle('active', c === b));
  curStyle = b.dataset.style;
});
const STYLE_SUFFIX = {
  photo: ', ultra detailed photograph, natural light, 8k',
  paint: ', beautiful oil painting, rich colours, painterly brushstrokes',
  anime: ', anime style illustration, vibrant, studio quality',
  render: ', 3D render, cinematic lighting, octane render'
};

/* ---------- flow helpers ---------- */
function addUser(text){
  $('greet').classList.add('hidden');
  const d = document.createElement('div');
  d.className = 'turn-u'; d.textContent = text;
  flow.appendChild(d);
}
function addThinking(text){
  const d = document.createElement('div');
  d.className = 'turn-a thinking';
  d.innerHTML = '<span class="dotpulse"></span><span></span>';
  d.lastChild.textContent = text;
  flow.appendChild(d);
  window.scrollTo({top: document.body.scrollHeight});
  return d;
}

/* ---------- send ---------- */
let busy = false;
async function send(){
  const text = promptEl.value.trim();
  if (!text || busy) return;
  const qk = mode === 'txt' ? 'txt' : 'img';
  if (quotaLeft(qk).left <= 0) {
    addUser(text);
    const d = document.createElement('div');
    d.className = 'turn-a';
    d.textContent = 'ಇಂದಿನ ಉಚಿತ ಮಿತಿ ಮುಗಿಯಿತು — ನಾಳೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ 🙏';
    flow.appendChild(d);
    promptEl.value = '';
    return;
  }
  if (mode === 'edit' && !$('editFile').files.length) {
    addUser(text);
    const d0 = document.createElement('div');
    d0.className = 'turn-a';
    d0.textContent = 'ಮೊದಲು ಒಂದು ಫೋಟೋ ಆಯ್ಕೆ ಮಾಡಿ 📷 — ಕೆಳಗಿನ "ಫೋಟೋ ಆಯ್ಕೆ ಮಾಡಿ" ಬಟನ್ ಒತ್ತಿ.';
    flow.appendChild(d0);
    promptEl.value = '';
    return;
  }
  busy = true; $('sendBtn').disabled = true;
  addUser(text);
  promptEl.value = ''; promptEl.style.height = 'auto';
  if (mode === 'img') {
    const wait = addThinking('ಚಿತ್ರ ತಯಾರಾಗುತ್ತಿದೆ… 20–60 ಸೆಕೆಂಡ್ ತಗಲಬಹುದು');
    const [w, h] = $('imgSize').value.split('x');
    const seed = Math.floor(Math.random() * 999999);
    const url = 'https://image.pollinations.ai/prompt/' +
      encodeURIComponent(text + STYLE_SUFFIX[curStyle]) +
      '?width=' + w + '&height=' + h + '&model=flux&nologo=true&seed=' + seed;
    const img = new Image();
    img.onload = () => {
      useQuota('img'); paintQuota();
      wait.classList.remove('thinking'); wait.textContent = '';
      wait.appendChild(img);
      const acts = document.createElement('div'); acts.className = 'acts';
      const a = document.createElement('a');
      a.className = 'actbtn'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '⬇ ತೆರೆಯಿರಿ / ಉಳಿಸಿ';
      acts.appendChild(a); wait.appendChild(acts);
      busy = false; $('sendBtn').disabled = false;
      window.scrollTo({top: document.body.scrollHeight});
    };
    img.onerror = () => {
      wait.classList.remove('thinking');
      wait.textContent = 'ಈಗ ಮಾಡೆಲ್ ಬಿಜಿ ಇದೆ — ಒಂದು ನಿಮಿಷದ ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
      busy = false; $('sendBtn').disabled = false;
    };
    img.src = url;
  } else if (mode === 'txt') {
    const wait = addThinking('ಬರೆಯುತ್ತಿದೆ…');
    try {
      const out = await geminiText(text);
      useQuota('txt'); paintQuota();
      wait.classList.remove('thinking'); wait.textContent = out;
      const acts = document.createElement('div'); acts.className = 'acts';
      const cp = document.createElement('button');
      cp.className = 'actbtn'; cp.textContent = '📋 ನಕಲಿಸಿ';
      cp.onclick = () => {
        if (navigator.clipboard) navigator.clipboard.writeText(out);
        cp.textContent = '✓ ನಕಲಾಗಿದೆ';
        setTimeout(() => cp.textContent = '📋 ನಕಲಿಸಿ', 1500);
      };
      acts.appendChild(cp); wait.appendChild(acts);
    } catch (e) {
      wait.classList.remove('thinking');
      wait.textContent = 'ಈಗ ಮಾಡೆಲ್ ಬಿಜಿ ಇದೆ — ಸ್ವಲ್ಪ ಹೊತ್ತಿನ ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
    }
    busy = false; $('sendBtn').disabled = false;
    window.scrollTo({top: document.body.scrollHeight});
  } else {
    const wait = addThinking('ಫೋಟೋ ಎಡಿಟ್ ಆಗುತ್ತಿದೆ… 20–60 ಸೆಕೆಂಡ್ ತಗಲಬಹುದು');
    try {
      const b64 = await fileToBase64($('editFile').files[0]);
      const outUrl = await geminiEditImage(text, b64);
      useQuota('img'); paintQuota();
      wait.classList.remove('thinking'); wait.textContent = '';
      const im = new Image(); im.src = outUrl; wait.appendChild(im);
      const acts = document.createElement('div'); acts.className = 'acts';
      const a = document.createElement('a');
      a.className = 'actbtn'; a.href = outUrl; a.download = 'kaimdv-edit.jpg';
      a.textContent = '⬇ ಉಳಿಸಿ';
      acts.appendChild(a); wait.appendChild(acts);
    } catch (e) {
      wait.classList.remove('thinking');
      wait.textContent = 'ಈಗ ಎಡಿಟ್ ಮಾಡೆಲ್ ಬಿಜಿ ಇದೆ — ಸ್ವಲ್ಪ ಹೊತ್ತಿನ ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
    }
    busy = false; $('sendBtn').disabled = false;
    window.scrollTo({top: document.body.scrollHeight});
  }
}
$('sendBtn').onclick = send;
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
promptEl.addEventListener('input', () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 140) + 'px';
});
</script>
</body>
</html>
